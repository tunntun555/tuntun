name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Setup Android SDK (cmdline-tools + licenses)
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          # ดาวน์โหลด cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          # สร้าง symlink ที่ buildozer คาดหวัง (tools/bin/sdkmanager)
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_SDK_ROOT/tools/bin/sdkmanager

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          # Accept licenses
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

          # ติดตั้ง build-tools และ platform ที่ต้องการ
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-33" || true

          echo "✓ Android SDK พร้อม"
          ls $ANDROID_SDK_ROOT/

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo "=== ตรวจสอบไฟล์ใน bin/ ==="
          ls -la bin/ || echo "ไม่มีโฟลเดอร์ bin/"
          echo "=== 50 บรรทัดสุดท้ายของ log ==="
          tail -50 build.log

      - name: ตรวจว่ามี APK จริง
        run: |
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✓ พบ APK:"
            ls -lh bin/*.apk
          else
            echo "✗ ไม่พบ APK — ดู build.log"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
