name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
          echo "=== ตรวจสอบไฟล์ใน bin/ ==="
          ls -la bin/ || echo "ไม่มีโฟลเดอร์ bin/"
          echo "=== 50 บรรทัดสุดท้ายของ log ==="
          tail -50 build.log

      - name: ตรวจว่ามี APK จริง
        run: |
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✓ พบ APK:"
            ls -lh bin/*.apk
          else
            echo "✗ ไม่พบ APK — ดู build.log"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
